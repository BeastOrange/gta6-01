<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — Open-World Crime</title>
<meta name="description" content="Solmar Bay: an original open-world crime game. Steal cars, outrun the SBPD, run jobs for Mara Voss and take over a sun-soaked coastal city.">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a141e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  noscript p { color: #fff; font: 16px sans-serif; padding: 2em; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: explore a coastal city on foot and by car, steal cars, dodge the police and run story missions"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p>Solmar Bay needs JavaScript to play.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
